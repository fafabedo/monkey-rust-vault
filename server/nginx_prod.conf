server {
    listen 80;
    server_name vault.monkeylibrary.app;

    # Certbot will add the SSL redirect here automatically
    location / {
        return 301 https://$host$request_uri;
    }

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name vault.monkeylibrary.app;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/vault.monkeylibrary.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.monkeylibrary.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size — adjust to match your largest expected file
    client_max_body_size 100M;

    # Timeouts for large uploads
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass         http://127.0.0.1:4200;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable request buffering so large uploads stream directly to the app
        proxy_request_buffering off;
    }
}
