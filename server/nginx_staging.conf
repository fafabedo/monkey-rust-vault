# ─── Cloudflare proxied setup ────────────────────────────────────────────────
# CF SSL mode must be "Full (Strict)" — CF talks HTTPS to this origin using the
# Certbot cert. Set in Cloudflare dashboard → SSL/TLS → Overview.
#
# Real visitor IPs are restored via CF-Connecting-IP using the real_ip module.
# CF IP ranges below — refresh from https://www.cloudflare.com/ips/ if they change.
# ─────────────────────────────────────────────────────────────────────────────

# ── Restore real visitor IP from CF-Connecting-IP ────────────────────────────
# These directives are valid in http/server/location context.
# Place here (server level) so $remote_addr is the real client IP everywhere.

# Cloudflare IPv4
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Use CF-Connecting-IP (most reliable); falls back to leftmost XFF entry.
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;

# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name vault.venux-channel.com;

    # ACME challenge — CF proxies /.well-known/ through to origin on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # All other HTTP traffic is rejected — CF's "Always Use HTTPS" rule handles
    # the client-side redirect before it reaches this server.
    location / {
        return 444;
    }
}

server {
    listen 443 ssl;
    server_name vault.venux-channel.com;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/vault.venux-channel.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vault.venux-channel.com/privkey.pem; # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Max upload size — adjust to match your largest expected file
    client_max_body_size 100M;

    # Timeouts for large uploads
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass         http://127.0.0.1:4200;
        proxy_http_version 1.1;

        # After real_ip processing, $remote_addr is the real visitor IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # CF sets X-Forwarded-Proto to the scheme the client used (always https
        # when CF proxies). Forward it so the app sees "https" regardless of
        # whether CF contacted this origin over HTTP or HTTPS.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Forward CF headers the app may need for geo/bot filtering.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry      $http_cf_ipcountry;

        # Disable request buffering so large uploads stream directly to the app
        proxy_request_buffering off;
    }
}
