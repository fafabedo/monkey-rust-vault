name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        run: ssh -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} echo "SSH connection OK"

      - name: Copy binary to server
        run: |
          scp target/x86_64-unknown-linux-musl/release/monkey-vault ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/monkey-vault

      - name: Deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s << 'EOF'
            set -e

            # Stop running instance if any
            pkill -f monkey-vault || true
            sleep 1

            # Install new binary
            mv /tmp/monkey-vault ~/bin/monkey-vault
            chmod +x ~/bin/monkey-vault

            # Start in background, append logs
            nohup ~/bin/monkey-vault >> ~/monkey-vault.log 2>&1 &

            # Give it a moment to start or crash
            sleep 3

            if pgrep -f monkey-vault > /dev/null; then
              echo "Deployment successful (PID $(pgrep -f monkey-vault))"
            else
              echo "Service failed to start — last log lines:"
              tail -20 ~/monkey-vault.log
              exit 1
            fi
          EOF
